<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client?onload=onGoogleLibraryLoad" async defer></script>
</head>
<body>

  <header class="global-header">
    <a href="index.html" class="header-logo">زواج</a>
    <div class="hamburger" onclick="document.querySelector('.header-nav').classList.toggle('active')">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav class="header-nav">
      <a href="index.html">الرئيسية</a>
      <a href="browse.html">تصفح البروفايلات</a>
      <div id="auth-links" style="display:none; gap: 20px; align-items: center;">
        <a href="login.html" class="header-btn">تسجيل دخول</a>
        <a href="register.html">حساب جديد</a>
      </div>
      <div id="user-links" style="display:none; gap: 20px; align-items: center;">
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="#" onclick="logout(); return false;">تسجيل خروج</a>
      </div>
    </nav>
  </header>
  <script>
    function updateHeader() {
      const token = localStorage.getItem('token');
      if (token) {
        const userLinks = document.getElementById('user-links');
        const authLinks = document.getElementById('auth-links');
        if(userLinks) userLinks.style.display = 'flex';
        if(authLinks) authLinks.style.display = 'none';
      } else {
        const userLinks = document.getElementById('user-links');
        const authLinks = document.getElementById('auth-links');
        if(userLinks) userLinks.style.display = 'none';
        if(authLinks) authLinks.style.display = 'flex';
      }
    }
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('gender');
      window.location.href = 'index.html';
    }
    document.addEventListener('DOMContentLoaded', updateHeader);
  </script>

  <div class="container">
    <h1>إنشاء حساب جديد</h1>
    <form id="registerForm">
      <label>رقم الهاتف
        <input type="tel" name="phone" placeholder="01xxxxxxxxx" required>
      </label>
      <label>كلمة المرور
        <input type="password" name="password" minlength="6" title="يجب أن تحتوي على الأقل 6 أحرف" required>
      </label>

      <button type="submit">إنشاء الحساب</button>
    </form>
    
    <div id="google-separator" style="margin: 20px 0; text-align: center; display: none;">أو باستخدام جوجل</div>


    <div id="google-btn-container" style="display: flex; justify-content: center;"></div>

    <p id="msg"></p>
    <p>عندك حساب؟ <a href="login.html">سجّل دخول</a></p>
  </div>

<script>
let googleClientId = '';
let googleLoaded = false;

window.onGoogleLibraryLoad = () => {
  googleLoaded = true;
  initGoogleButton();
};

window.onload = async () => {
  try {
    const res = await fetch('/api/config');
    const config = await res.json();
    googleClientId = config.googleClientId;
    initGoogleButton();
  } catch (err) {
    console.error('Failed to load Google config');
  }
};

function initGoogleButton() {
  if (googleLoaded && googleClientId) {
    document.getElementById('google-separator').style.display = 'block';
    google.accounts.id.initialize({
      client_id: googleClientId,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById('google-btn-container'),
      { theme: 'outline', size: 'large', text: 'signup_with' }
    );
  }
}

async function handleCredentialResponse(response) {
  const msg = document.getElementById('msg');

  
  msg.textContent = 'جاري الإرسال بحساب جوجل...';
  msg.className = '';
  
  try {
    const csrfRes = await fetch('/api/csrf-token');
    const csrfData = await csrfRes.json();
    
    const res = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'CSRF-Token': csrfData.csrfToken },
      body: JSON.stringify({ token: response.credential })
    });
    const result = await res.json();
    
    if (!res.ok) {
      msg.textContent = result.error;
      msg.className = 'error';
      return;
    }
    
    localStorage.setItem('token', result.token);
    if (result.gender) localStorage.setItem('gender', result.gender);
    else localStorage.removeItem('gender');
    msg.textContent = 'تم الدخول بنجاح! هنحولك للوحة التحكم...';
    msg.className = 'success';
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  } catch (err) {
    msg.textContent = 'حصل خطأ في الاتصال بالسيرفر';
    msg.className = 'error';
  }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const msg = document.getElementById('msg');
  msg.textContent = 'جاري الإرسال...';
  try {
    const csrfRes = await fetch('/api/csrf-token');
    const csrfData = await csrfRes.json();
    const csrfToken = csrfData.csrfToken;

    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'CSRF-Token': csrfToken },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (!res.ok) { msg.textContent = result.error; msg.className = 'error'; return; }
    localStorage.setItem('token', result.token);
    localStorage.removeItem('gender');
    msg.textContent = 'تم إنشاء الحساب! هنحولك للوحة التحكم...';
    msg.className = 'success';
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  } catch (err) {
    msg.textContent = 'حصل خطأ في الاتصال بالسيرفر';
    msg.className = 'error';
  }
});
</script>

  <footer class="global-footer">
    <div class="footer-links">
      <a href="about.html">عن الموقع</a>
      <a href="privacy.html">سياسة الخصوصية</a>
      <a href="terms.html">الشروط والأحكام</a>
      <a href="faq.html">الأسئلة الشائعة</a>
      <a href="contact.html">اتصل بنا</a>
    </div>
    <div class="footer-copyright">
      &copy; 2026 موقع زواج الإسلامي. جميع الحقوق محفوظة.
    </div>
  </footer>

</body>
</html>
