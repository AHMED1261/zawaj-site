<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحميل...</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="global-header">
    <a href="index.html" class="header-logo">زواج</a>
    <div class="hamburger" onclick="document.querySelector('.header-nav').classList.toggle('active')">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav class="header-nav">
      <a href="index.html">الرئيسية</a>
      <a href="browse.html">تصفح البروفايلات</a>
      <div id="auth-links" style="display:none; gap: 20px; align-items: center;">
        <a href="login.html" class="header-btn">تسجيل دخول</a>
        <a href="register.html">حساب جديد</a>
      </div>
      <div id="user-links" style="display:none; gap: 20px; align-items: center;">
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="#" onclick="logout(); return false;">تسجيل خروج</a>
      </div>
    </nav>
  </header>
  <script>
    function updateHeader() {
      const token = localStorage.getItem('token');
      if (token) {
        const userLinks = document.getElementById('user-links');
        const authLinks = document.getElementById('auth-links');
        if(userLinks) userLinks.style.display = 'flex';
        if(authLinks) authLinks.style.display = 'none';
      } else {
        const userLinks = document.getElementById('user-links');
        const authLinks = document.getElementById('auth-links');
        if(userLinks) userLinks.style.display = 'none';
        if(authLinks) authLinks.style.display = 'flex';
      }
    }
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('gender');
      window.location.href = 'index.html';
    }
    document.addEventListener('DOMContentLoaded', updateHeader);
  </script>

  <div class="container wide">
    <h1 id="page-title">جاري التحميل...</h1>
    <div id="page-content" style="line-height: 1.8; color: #444; min-height: 400px;"></div>
  </div>

  <script>
    async function loadPage() {
      // Extract the slug from the filename (e.g. about.html -> about)
      const slug = window.location.pathname.split('/').pop().replace('.html', '');
      try {
        const res = await fetch('/api/pages/' + slug);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('page-title').textContent = data.title;
          document.title = data.title;
          document.getElementById('page-content').innerHTML = data.content;
        } else {
          document.getElementById('page-title').textContent = 'خطأ';
          document.getElementById('page-content').textContent = 'تعذر تحميل الصفحة.';
        }
      } catch (err) {
        document.getElementById('page-title').textContent = 'خطأ';
        document.getElementById('page-content').textContent = 'حدث خطأ في الاتصال.';
      }
    }
    loadPage();
  </script>

  <footer class="global-footer">
    <div class="footer-links">
      <a href="about.html">عن الموقع</a>
      <a href="privacy.html">سياسة الخصوصية</a>
      <a href="terms.html">الشروط والأحكام</a>
      <a href="faq.html">الأسئلة الشائعة</a>
      <a href="contact.html">اتصل بنا</a>
    </div>
    <div class="footer-copyright">
      &copy; 2026 موقع زواج الإسلامي. جميع الحقوق محفوظة.
    </div>
  </footer>
</body>
</html>
